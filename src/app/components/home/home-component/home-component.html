
<div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">Portal de Operaciones</h2>
            </div>
            
            <nav class="sidebar-nav">
                <ul class="menu-list">
                    <li class="menu-item active">
                        <a href="/">
                            <i class="fas fa-home"></i>
                            <span>Inicio</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="/agent">
                            <i class="fas fa-robot"></i>
                            <span>Agente de IA</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="/vuelos">
                            <i class="fa-solid fa-plane-up"></i>
                            <span>Mis vuelos</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="/reservas">
                            <i class="fa-solid fa-ticket"></i>
                            <span>Mis reservaciones</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Improved user menu with dropdown functionality -->
    <div class="sidebar-footer">
        <div class="user-menu">
        <div class="user-info" (click)="toggleUserMenu()">
            <i class="fas fa-user-circle"></i>
            <span>Usuario</span>
            <i class="fas fa-chevron-down dropdown-arrow" [class.rotate]="isUserMenuOpen"></i>
        </div>
        <div class="user-dropdown" [class.show]="isUserMenuOpen">
            <button class="dropdown-item" (click)="handleLogin()">
            <i class="fas fa-sign-in-alt"></i>
            <span>Iniciar Sesión</span>
            </button>
            <button class="dropdown-item" (click)="handleRegister()">
            <i class="fas fa-user-plus"></i>
            <span>Registrarse</span>
            </button>
        </div>
        </div>
    </div>
        </aside>
</div>
